<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta property="og:title" content="CourrierReader で開く">
  <meta property="og:description" content="クーリエ・ジャポンの記事を CourrierReader で開きます。">
  <title>CourrierReader で開く</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --fg: #102a43;
      --muted: #52667a;
      --card: #ffffff;
      --accent: #0e2a47;
      --accent-fg: #ffffff;
      --border: #d7e1ec;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1b2b;
        --fg: #eaf2fb;
        --muted: #a9bbcd;
        --card: #12293f;
        --accent: #ffc24b;
        --accent-fg: #102a43;
        --border: #28435c;
        --danger: #ffb4ab;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      padding: 24px 16px 40px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { margin: 8px 0; }
    .muted { color: var(--muted); font-size: .92rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin: 16px 0;
    }
    .button {
      display: block;
      margin: 16px 0;
      padding: 16px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-fg);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      word-break: break-all;
    }
    .button.secondary {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
      font-size: .95rem;
      font-weight: 600;
      padding: 12px;
    }
    .error { color: var(--danger); font-weight: 600; }
    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .9em;
      word-break: break-all;
    }
    form { display: flex; gap: 8px; margin-top: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--fg);
      font-size: 1rem;
    }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-fg);
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
<main>
  <h1>CourrierReader で開く</h1>
  <p class="muted">クーリエ・ジャポンの記事を、CourrierReader の新しいタブで開きます。</p>

  <section id="validSection" class="card" hidden>
    <p class="muted">記事 ID: <code id="articleId"></code></p>
    <p>下のボタンをタップすると CourrierReader が起動します。</p>
    <a id="openLink" class="button" href="#">CourrierReader で開く</a>
    <a id="intentLink" class="button secondary" href="#">intent:// で開く（予備）</a>
    <p class="muted">アプリがインストールされていない場合は開けません。</p>
    <p><a id="browserLink" href="https://courrier.jp/">ブラウザで記事を開く</a></p>
  </section>

  <section id="invalidSection" class="card" hidden>
    <p class="error">記事 ID が指定されていないか、形式が正しくありません。</p>
    <p class="muted">記事 ID は正の整数で指定してください。</p>
  </section>

  <section class="card">
    <p><strong>記事 ID を指定して開く</strong></p>
    <form id="idForm">
      <input id="idInput" type="text" inputmode="numeric" pattern="[1-9][0-9]*"
             placeholder="例: 465385" autocomplete="off">
      <button type="submit">開く</button>
    </form>
    <p class="muted">URL の <code>?id=465385</code> からも指定できます。</p>
  </section>

  <noscript>
    <div class="card">
      <p class="error">JavaScript が無効のため、このページからアプリを開けません。</p>
      <p>URL の <code>?id=</code> に記事 ID を付けてアクセスしてください。</p>
    </div>
  </noscript>
</main>
<script>
(function () {
  'use strict';

  var ID_PATTERN = /^[1-9][0-9]{0,11}$/;
  var validSection = document.getElementById('validSection');
  var invalidSection = document.getElementById('invalidSection');
  var articleId = document.getElementById('articleId');
  var openLink = document.getElementById('openLink');
  var intentLink = document.getElementById('intentLink');
  var browserLink = document.getElementById('browserLink');
  var idForm = document.getElementById('idForm');
  var idInput = document.getElementById('idInput');

  function showInvalid() {
    validSection.hidden = true;
    invalidSection.hidden = false;
  }

  function showValid(id) {
    var deepLink = 'courrierreader://article/' + id;
    var intentLinkValue = 'intent://article/' + id +
      '#Intent;scheme=courrierreader;package=com.example.courrierreader;end';
    var articleUrl = 'https://courrier.jp/news/archives/' + id + '/';

    articleId.textContent = id;
    openLink.href = deepLink;
    intentLink.href = intentLinkValue;
    browserLink.href = articleUrl;
    document.title = 'CourrierReader - 記事 ' + id;

    invalidSection.hidden = true;
    validSection.hidden = false;
  }

  var id = new URLSearchParams(window.location.search).get('id');
  id = id ? id.trim() : '';

  if (ID_PATTERN.test(id)) {
    showValid(id);
  } else {
    showInvalid();
    if (id) {
      idInput.value = id;
    }
  }

  idForm.addEventListener('submit', function (event) {
    event.preventDefault();
    var value = idInput.value.trim();
    if (!ID_PATTERN.test(value)) {
      showInvalid();
      return;
    }
    var next = new URL(window.location.href);
    next.searchParams.set('id', value);
    window.location.href = next.toString();
  });
})();
</script>
</body>
</html>
